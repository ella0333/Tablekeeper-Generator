# The only way out of the factory network. Anything not listed here is denied
# and logged; read it with `docker compose exec squid tail -f /var/log/squid/access.log`.
http_port 3128

acl factory src 172.31.250.0/24

# Model provider and BAND
acl allowed dstdomain .openrouter.ai .band.ai
# Package registries the seats and image builds install from
acl allowed dstdomain pypi.org files.pythonhosted.org
acl allowed dstdomain registry.npmjs.org registry.yarnpkg.com
acl allowed dstdomain deb.debian.org security.debian.org
acl allowed dstdomain dl-cdn.alpinelinux.org
# Docker Hub, for base images in stage Dockerfiles
acl allowed dstdomain registry-1.docker.io auth.docker.io index.docker.io
# Docker Hub serves image layers from these CDNs
acl allowed dstdomain production.cloudflare.docker.com production.cloudfront.docker.com docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
# Playwright's browser download, used by the official harness image
acl allowed dstdomain cdn.playwright.dev playwright.download.prss.microsoft.com playwright.azureedge.net playwright-akamai.azureedge.net playwright-verizon.azureedge.net

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow factory allowed
http_access deny all

# No caching; this is a gate, not a cache.
cache deny all
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
