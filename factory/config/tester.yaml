plugins:
  enabled: [band]

group_sessions_per_user: false

platforms:
  band:
    extra:
      dm_policy: allowlist
      group_policy: allowlist

agent:
  max_turns: 200

approvals:
  mode: "off"

terminal:
  backend: local
  cwd: /work/band-work/result
  timeout: 1200

delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: false
  max_iterations: 40
  child_timeout_seconds: 900

display:
  busy_input_mode: queue
  interim_assistant_messages: false

onboarding:
  profile_build: "off"

auxiliary:
  background_review:
    enabled: false
memory:
  memory_enabled: false
  user_profile_enabled: false
